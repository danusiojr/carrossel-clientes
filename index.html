<style>
  :root { --altura: 72px; --intervalo: 64px; --duracao: 52s; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height: 100%; background: transparent; overflow: hidden; }
  body { display: flex; align-items: center; }
  .faixa {
    position: relative; width: 100%;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
            mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
  }
  .trilho { display: flex; width: max-content; animation: correr var(--duracao) linear infinite; }
  .faixa:hover .trilho { animation-play-state: paused; }
  ul { display: flex; align-items: center; gap: var(--intervalo); padding-right: var(--intervalo); list-style: none; }
  li { flex: 0 0 auto; }
  img {
    height: var(--altura); width: auto; display: block;
    opacity: .82; transition: opacity .3s ease;
  }
  li:hover img { opacity: 1; }
  @keyframes correr { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @media (prefers-reduced-motion: reduce) {
    .trilho { animation: none; flex-wrap: wrap; justify-content: center; width: 100%; }
    ul:last-child { display: none; }
  }
  @media (max-width: 750px) { :root { --altura: 52px; --intervalo: 40px; } }
</style>
