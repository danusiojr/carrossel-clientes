<!doctype html>
<meta charset="utf-8">
<title>OAB Ceará</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Questrial&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:#0d0d0d; overflow:hidden; }
  body { font-family: Questrial, "Segoe UI", system-ui, sans-serif; color:#fff; }
  .cena { position:relative; width:100%; height:100%; }
  video, .cartaz { position:absolute; inset:0; width:100%; height:100%;
                    object-fit:cover; object-position:center 35%; }
  .veu { position:absolute; inset:0; z-index:2; pointer-events:none;
    background:
      linear-gradient(90deg, rgba(8,8,8,.9) 0%, rgba(8,8,8,.66) 36%, rgba(8,8,8,.18) 66%, rgba(8,8,8,.3) 100%),
      linear-gradient(180deg, rgba(8,8,8,.4) 0%, transparent 32%, transparent 68%, rgba(8,8,8,.45) 100%); }
  .texto { position:relative; z-index:3; height:100%; display:flex; flex-direction:column;
            justify-content:center; padding:0 clamp(24px,5vw,92px); max-width:760px; }
  .sobre { margin-bottom:14px; font-size:clamp(11px,1vw,13px); letter-spacing:.18em;
            text-transform:uppercase; color:rgba(255,255,255,.6); }
  h1 { font-size:clamp(40px,7vw,96px); font-weight:400; line-height:.98;
        letter-spacing:-.02em; margin-bottom:22px; }
  p { font-size:clamp(14px,1.3vw,19px); line-height:1.55; max-width:34em; color:rgba(255,255,255,.86); }
  @media (prefers-reduced-motion: reduce) { video { display:none; } }
</style>

<div class="cena">
  <img class="cartaz" src="https://static.wixstatic.com/media/eb1557_82a4fd868d404abbbb30ce21a5365e09f002.jpg/v1/fill/w_1600,h_900,al_c,q_85/file.jpg" alt="">
  <video id="v" muted loop playsinline preload="none"></video>
  <div class="veu"></div>
  <div class="texto">
    <div class="sobre">Institucional · 90 anos</div>
    <h1>OAB Ceará</h1>
    <p>Vídeo institucional sobre os serviços da OAB-CE, produzido no contexto das comemorações de 90 anos da entidade.</p>
  </div>
</div>

<script>
  // Janela escolhida a dedo: o filme completo tem legenda queimada fora
  // deste trecho, e repetir so este pedaco tambem evita baixar o arquivo
  // inteiro (sao dezenas de MB).
  const INI = 0, FIM = 9;
  const v = document.getElementById('v');
  const fonte = 'https://video.wixstatic.com/video/eb1557_82a4fd868d404abbbb30ce21a5365e09/720p/mp4/file.mp4';
  const parado = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  v.addEventListener('loadedmetadata', () => { if (INI > 0) v.currentTime = INI; });
  v.addEventListener('timeupdate', () => {
    if (v.currentTime >= FIM || v.currentTime < INI - 0.5) v.currentTime = INI;
  });

  function ligar() { if (parado) return; if (!v.src) v.src = fonte; v.play().catch(() => {}); }
  function desligar() { v.pause(); }

  if ('IntersectionObserver' in window) {
    new IntersectionObserver(es => es.forEach(e => e.isIntersecting ? ligar() : desligar()),
                             { threshold: 0.15 }).observe(document.body);
  } else { ligar(); }
</script>
